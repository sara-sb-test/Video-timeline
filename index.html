<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conflict-Pro Planner</title>
    <style>
        :root {
            --primary: #6366f1; --bg: #0f172a; --card: #1e293b;
            --border: #334155; --cell-w: 60px; --label-w: 200px;
            --holiday-marker: #ff4d4d; --holiday-bg: #991b1b; 
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #f1f5f9; padding: 20px; margin: 0; }
        
        /* Controls & Color Palette */
        .controls { background: var(--card); padding: 20px; border-radius: 12px; display: flex; gap: 15px; margin-bottom: 20px; border: 1px solid var(--border); align-items: center; flex-wrap: wrap; }
        input { background: #0f172a; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; width: 140px; }
        
        .palette { display: grid; grid-template-columns: repeat(6, 25px); gap: 5px; }
        .color-opt { width: 25px; height: 25px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; transition: 0.2s; }
        .color-opt.active { border-color: white; transform: scale(1.1); }

        /* Grids */
        .timeline-container { border: 1px solid var(--border); border-radius: 12px; overflow: auto; background: var(--card); position: relative; margin-bottom: 30px; }
        .section-header { padding: 12px 20px; background: #0f172a; font-size: 14px; font-weight: bold; border-bottom: 1px solid var(--border); color: var(--primary); letter-spacing: 1px; }
        .header-row { display: flex; background: #1e293b; position: sticky; top: 0; z-index: 100; }
        .task-row { display: flex; position: relative; border-bottom: 1px solid var(--border); min-height: 60px; }
        
        .cell { width: var(--cell-w); min-width: var(--cell-w); height: 60px; border-right: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 11px; flex-shrink: 0; box-sizing: border-box; cursor: pointer; position: relative; }
        .label-cell { width: var(--label-w); min-width: var(--label-w); background: #1e293b; position: sticky; left: 0; z-index: 50; padding: 0 15px; font-weight: bold; border-right: 2px solid var(--primary); justify-content: space-between; cursor: default; }

        /* Holiday Design */
        .holiday { background: var(--holiday-bg) !important; }
        .holiday::after { content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0; border-style: solid; border-width: 0 12px 12px 0; border-color: transparent var(--holiday-marker) transparent transparent; }

        .overlap-alert { position: absolute; top: 4px; left: 4px; color: #fbbf24; font-size: 16px; z-index: 20; }
        
        /* Task Bars */
        .task-group { position: absolute; height: 38px; top: 11px; z-index: 10; display: flex; align-items: center; pointer-events: none; }
        .task-segment { height: 38px; background: var(--task-color); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; color: white; overflow: hidden; white-space: nowrap; box-sizing: border-box; pointer-events: auto; cursor: grab; border: 1px solid rgba(255,255,255,0.1); position: relative; }
        .segment-start { border-top-left-radius: 8px; border-bottom-left-radius: 8px; }
        .segment-end { border-top-right-radius: 8px; border-bottom-right-radius: 8px; }
        .gap { background: transparent !important; border: none; pointer-events: none; } 

        /* BIG ALERT ICON */
        .bar-alert { font-size: 30px; position: absolute; z-index: 5; text-shadow: 0 0 10px rgba(0,0,0,0.5); }

        button { border: none; border-radius: 6px; padding: 10px 18px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; }
        .btn-share { background: #10b981; color: white; margin-left: auto; }
        .delete-btn { color: #64748b; background: none; font-size: 18px; padding: 0; cursor: pointer; }
    </style>
</head>
<body>

<div class="controls">
    <input type="text" id="name" placeholder="Task Name">
    <input type="date" id="date" value="2025-12-17">
    <input type="number" id="dur" placeholder="Days" step="0.5" value="1">
    
    <div class="palette" id="palette">
        </div>
    
    <button class="btn-add" onclick="addTask()">Add Task</button>
    <button class="btn-share" onclick="generateShareLink()">🔗 Copy Share Link</button>
</div>

<div class="section-header">INDIVIDUAL TASK BREAKDOWN</div>
<div class="timeline-container">
    <div class="header-row" id="headerRowTop"></div>
    <div id="taskBodyTop"></div>
</div>

<div class="section-header">CAPACITY SUMMARY</div>
<div class="timeline-container">
    <div class="header-row" id="headerRowBottom"></div>
    <div id="taskBodyBottom"></div>
</div>

<script>
    const stylishColors = [
        '#6366f1', '#ec4899', '#10b981', '#f59e0b', 
        '#ef4444', '#8b5cf6', '#06b6d4', '#84cc16', 
        '#f97316', '#64748b', '#d946ef', '#14b8a6'
    ];
    let selectedColor = stylishColors[0];
    let tasks = [];
    let holidays = [];
    
    const startRange = new Date(2025, 11, 17);
    const endRange = new Date(2026, 0, 31);
    const cellW = 60;
    const labelW = 200;

    // Init Palette
    const palette = document.getElementById('palette');
    stylishColors.forEach(c => {
        const div = document.createElement('div');
        div.className = 'color-opt';
        div.style.backgroundColor = c;
        if(c === selectedColor) div.classList.add('active');
        div.onclick = () => {
            document.querySelectorAll('.color-opt').forEach(el => el.classList.remove('active'));
            div.classList.add('active');
            selectedColor = c;
        };
        palette.appendChild(div);
    });

    function toISO(date) { return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0'); }
    function fromISO(s) { const parts = s.split('-'); return new Date(parts[0], parts[1] - 1, parts[2]); }

    function loadData() {
        const params = new URLSearchParams(window.location.search);
        const data = params.get('data');
        if (data) {
            try {
                const decoded = JSON.parse(atob(data));
                tasks = decoded.tasks; holidays = decoded.holidays;
                saveLocally();
            } catch(e) { console.error("Invalid link"); }
        } else {
            tasks = JSON.parse(localStorage.getItem('shared_tasks_v16')) || [];
            holidays = JSON.parse(localStorage.getItem('shared_holidays_v16')) || [];
        }
    }

    function saveLocally() {
        localStorage.setItem('shared_tasks_v16', JSON.stringify(tasks));
        localStorage.setItem('shared_holidays_v16', JSON.stringify(holidays));
    }

    function generateShareLink() {
        const data = btoa(JSON.stringify({ tasks, holidays }));
        const url = window.location.origin + window.location.pathname + "?data=" + data;
        navigator.clipboard.writeText(url);
        alert("Share Link Copied!");
    }

    function getOccupiedDates(t) {
        let dates = []; let currentWork = 0; let tempDate = fromISO(t.start);
        while (holidays.includes(toISO(tempDate))) tempDate.setDate(tempDate.getDate() + 1);
        while (currentWork < t.dur) {
            const dStr = toISO(tempDate);
            if (!holidays.includes(dStr)) { dates.push(dStr); currentWork += 1; }
            tempDate.setDate(tempDate.getDate() + 1);
            if (tempDate > endRange) break;
        }
        return dates;
    }

    function render() {
        const days = [];
        let d = new Date(startRange);
        while(d <= endRange) { days.push(new Date(d)); d.setDate(d.getDate() + 1); }

        const bodyTop = document.getElementById('taskBodyTop');
        const bodyBottom = document.getElementById('taskBodyBottom');

        let dailyCount = {};
        tasks.forEach(t => { getOccupiedDates(t).forEach(d => dailyCount[d] = (dailyCount[d] || 0) + 1); });

        const headerHTML = `<div class="cell label-cell">DATE</div>` + days.map(d => {
            const dStr = toISO(d);
            const isH = holidays.includes(dStr);
            const alert = dailyCount[dStr] > 2 ? '<span class="overlap-alert">⚠️</span>' : '';
            return `<div class="cell ${isH ? 'holiday' : ''}" onclick="toggleHoliday('${dStr}')">${alert}<strong>${d.getDate()}</strong><br>${d.toLocaleDateString('en-US', {month:'short'})}</div>`;
        }).join('');
        
        document.getElementById('headerRowTop').innerHTML = headerHTML;
        document.getElementById('headerRowBottom').innerHTML = headerHTML;

        // Render Top
        bodyTop.innerHTML = '';
        tasks.forEach((t, idx) => {
            const row = document.createElement('div');
            row.className = 'task-row';
            row.innerHTML = `<div class="cell label-cell"><span>${t.name}</span><button class="delete-btn" onclick="deleteTask(${idx})">×</button></div>` + 
                            days.map(d => `<div class="cell ${holidays.includes(toISO(d)) ? 'holiday' : ''}" onclick="toggleHoliday('${toISO(d)}')"></div>`).join('');
            row.appendChild(createBar(t, true, dailyCount, days));
            bodyTop.appendChild(row);
        });

        // Render Bottom
        bodyBottom.innerHTML = '';
        const summaryRows = [[], []];
        const rowNames = ["MAIN WORK", "OVERLOAD"];
        tasks.sort((a,b) => fromISO(a.start) - fromISO(b.start)).forEach(t => {
            for(let i=0; i<2; i++) { if (!isOverlap(t, summaryRows[i])) { summaryRows[i].push(t); break; } }
        });
        summaryRows.forEach((rowTasks, idx) => {
            const row = document.createElement('div');
            row.className = 'task-row';
            row.innerHTML = `<div class="cell label-cell">${rowNames[idx]}</div>` + days.map(d => `<div class="cell ${holidays.includes(toISO(d)) ? 'holiday' : ''}"></div>`).join('');
            rowTasks.forEach(t => row.appendChild(createBar(t, false, dailyCount, days)));
            bodyBottom.appendChild(row);
        });
    }

    function isOverlap(task, existingTasks) {
        const newDates = getOccupiedDates(task);
        for (let t of existingTasks) { if (newDates.some(d => getOccupiedDates(t).includes(d))) return true; }
        return false;
    }

    function createBar(t, draggable, dailyCount, days) {
        const group = document.createElement('div');
        group.className = 'task-group';
        group.style.setProperty('--task-color', t.color);
        
        let visualStart = fromISO(t.start);
        while (holidays.includes(toISO(visualStart))) visualStart.setDate(visualStart.getDate() + 1);
        group.style.left = `${labelW + (Math.round((visualStart - startRange) / (1000*60*60*24)) * cellW)}px`;

        let currentWork = 0; let tempDate = new Date(visualStart);
        while (currentWork < t.dur) {
            const dStr = toISO(tempDate);
            const isH = holidays.includes(dStr);
            const seg = document.createElement('div');
            let wFactor = (t.dur - currentWork < 1 && !isH) ? (t.dur - currentWork) : 1;
            
            if (isH) {
                seg.className = 'task-segment gap';
                seg.style.width = `${cellW}px`;
            } else {
                seg.className = 'task-segment';
                if (currentWork === 0) seg.classList.add('segment-start');
                
                if (dailyCount[dStr] > 2) seg.innerHTML = `<span class="bar-alert">⚠️</span>`;
                
                if (currentWork + wFactor >= t.dur) {
                    seg.classList.add('segment-end');
                    seg.innerHTML += t.name;
                    seg.style.width = `${(wFactor * cellW) - 1}px`;
                } else {
                    seg.style.width = `${cellW}px`;
                }
                currentWork += 1;
            }
            group.appendChild(seg);
            tempDate.setDate(tempDate.getDate() + 1);
            if (tempDate > endRange) break;
        }

        if (draggable) {
            group.onmousedown = (e) => {
                let initialX = e.clientX;
                let originalStart = fromISO(t.start);
                document.onmousemove = (me) => {
                    let delta = Math.round((me.clientX - initialX) / cellW);
                    let newDate = new Date(originalStart);
                    newDate.setDate(newDate.getDate() + delta);
                    if (newDate >= startRange) { t.start = toISO(newDate); render(); }
                };
                document.onmouseup = () => { document.onmousemove = null; saveLocally(); };
            };
        }
        return group;
    }

    function toggleHoliday(dateStr) {
        const i = holidays.indexOf(dateStr);
        i > -1 ? holidays.splice(i, 1) : holidays.push(dateStr);
        saveLocally(); render();
    }

    function addTask() {
        const name = document.getElementById('name').value;
        const start = document.getElementById('date').value;
        const dur = parseFloat(document.getElementById('dur').value);
        if (name && start && !isNaN(dur)) {
            tasks.push({ name, start, dur, color: selectedColor });
            saveLocally(); render();
        }
    }

    function deleteTask(idx) { tasks.splice(idx, 1); saveLocally(); render(); }
    loadData();
    render();
</script>
</body>
</html>
