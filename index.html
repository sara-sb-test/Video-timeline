<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dual-View Precision Planner</title>
    <style>
        :root {
            --primary: #6366f1; --bg: #0f172a; --card: #1e293b;
            --border: #334155; --cell-w: 60px; --label-w: 200px;
            --holiday-marker: #ff4d4d;
            --holiday-bg: #991b1b; /* Adjusted lighter red for clarity */
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #f1f5f9; padding: 20px; margin: 0; }
        .controls { background: var(--card); padding: 15px; border-radius: 12px; display: flex; gap: 10px; margin-bottom: 20px; border: 1px solid var(--border); align-items: center; }
        input { background: #0f172a; border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; width: 140px; }
        
        .timeline-container { border: 1px solid var(--border); border-radius: 12px; overflow: auto; background: var(--card); position: relative; margin-bottom: 30px; }
        .section-header { padding: 10px 20px; background: #0f172a; font-size: 14px; font-weight: bold; border-bottom: 1px solid var(--border); color: var(--primary); letter-spacing: 1px; }
        
        .header-row { display: flex; background: #1e293b; position: sticky; top: 0; z-index: 100; }
        .task-row { display: flex; position: relative; border-bottom: 1px solid var(--border); min-height: 60px; }
        
        .cell { 
            width: var(--cell-w); min-width: var(--cell-w); height: 60px; 
            border-right: 1px solid var(--border); display: flex; align-items: center; 
            justify-content: center; font-size: 11px; flex-shrink: 0; 
            box-sizing: border-box; cursor: pointer; position: relative; text-align: center;
        }

        .label-cell { 
            width: var(--label-w); min-width: var(--label-w); background: #1e293b; 
            position: sticky; left: 0; z-index: 50; padding: 0 15px; font-weight: bold; 
            border-right: 2px solid var(--primary); justify-content: space-between; cursor: default;
        }

        .holiday { background: var(--holiday-bg) !important; }
        .holiday::after {
            content: ""; position: absolute; top: 0; right: 0;
            width: 0; height: 0;
            border-style: solid; border-width: 0 12px 12px 0;
            border-color: transparent var(--holiday-marker) transparent transparent;
        }

        .overlap-alert { position: absolute; top: 4px; left: 4px; color: #fbbf24; font-size: 14px; z-index: 20; filter: drop-shadow(0 0 2px black); }
        
        .task-group { position: absolute; height: 34px; top: 13px; z-index: 10; display: flex; align-items: center; pointer-events: none; }
        .task-segment { height: 34px; background: var(--task-color); display: flex; align-items: center; font-size: 10px; font-weight: bold; color: white; overflow: hidden; white-space: nowrap; box-sizing: border-box; pointer-events: auto; cursor: grab; border: 1px solid rgba(255,255,255,0.1); }
        .segment-start { border-top-left-radius: 6px; border-bottom-left-radius: 6px; padding-left: 8px; }
        .segment-end { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
        .gap { background: transparent !important; border: none; pointer-events: none; } 

        button { border: none; border-radius: 6px; padding: 8px 15px; cursor: pointer; font-weight: bold; }
        .btn-add { background: var(--primary); color: white; }
        .btn-share { background: #10b981; color: white; margin-left: auto; }
        .delete-btn { color: #64748b; background: none; font-size: 18px; padding: 0; cursor: pointer; }
        .delete-btn:hover { color: var(--holiday-marker); }
    </style>
</head>
<body>

<div class="controls">
    <input type="text" id="name" placeholder="Task Name">
    <input type="date" id="date" value="2025-12-17">
    <input type="number" id="dur" placeholder="Days" step="0.5" value="1">
    <input type="color" id="color" value="#6366f1">
    <button class="btn-add" onclick="addTask()">Add Task</button>
    <button class="btn-share" onclick="generateShareLink()">🔗 Copy Share Link</button>
</div>

<div class="section-header">INDIVIDUAL TASK BREAKDOWN</div>
<div class="timeline-container">
    <div class="header-row" id="headerRowTop"></div>
    <div id="taskBodyTop"></div>
</div>

<div class="section-header">CAPACITY SUMMARY</div>
<div class="timeline-container">
    <div class="header-row" id="headerRowBottom"></div>
    <div id="taskBodyBottom"></div>
</div>

<script>
    let tasks = [];
    let holidays = [];
    const startRange = new Date(2025, 11, 17);
    const endRange = new Date(2026, 0, 31);
    const cellW = 60;
    const labelW = 200;

    function toISO(date) { return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0'); }
    function fromISO(s) { const parts = s.split('-'); return new Date(parts[0], parts[1] - 1, parts[2]); }

    function loadData() {
        const params = new URLSearchParams(window.location.search);
        const data = params.get('data');
        if (data) {
            try {
                const decoded = JSON.parse(atob(data));
                tasks = decoded.tasks;
                holidays = decoded.holidays;
                saveLocally();
            } catch(e) { console.error("Invalid link"); }
        } else {
            tasks = JSON.parse(localStorage.getItem('shared_tasks_v14')) || [];
            holidays = JSON.parse(localStorage.getItem('shared_holidays_v14')) || [];
        }
    }

    function saveLocally() {
        localStorage.setItem('shared_tasks_v14', JSON.stringify(tasks));
        localStorage.setItem('shared_holidays_v14', JSON.stringify(holidays));
    }

    function generateShareLink() {
        const data = btoa(JSON.stringify({ tasks, holidays }));
        const url = window.location.origin + window.location.pathname + "?data=" + data;
        navigator.clipboard.writeText(url);
        alert("Share Link Copied!");
    }

    function getDays() {
        let d = new Date(startRange); let arr = [];
        while (d <= endRange) { arr.push(new Date(d)); d.setDate(d.getDate() + 1); }
        return arr;
    }

    function render() {
        const days = getDays();
        const headerTop = document.getElementById('headerRowTop');
        const bodyTop = document.getElementById('taskBodyTop');
        const headerBottom = document.getElementById('headerRowBottom');
        const bodyBottom = document.getElementById('taskBodyBottom');

        const headerHTML = (isTop) => {
            let html = `<div class="cell label-cell">DATE</div>`;
            days.forEach(d => {
                const dateStr = toISO(d);
                const isH = holidays.includes(dateStr);
                html += `<div class="cell ${isH ? 'holiday' : ''}" onclick="toggleHoliday('${dateStr}')"><strong>${d.getDate()}</strong><br>${d.toLocaleDateString('en-US', {month:'short'})}</div>`;
            });
            return html;
        };
        headerTop.innerHTML = headerHTML(true);
        headerBottom.innerHTML = headerHTML(false);

        let dailyCount = {};

        bodyTop.innerHTML = '';
        tasks.forEach((t, idx) => {
            const row = document.createElement('div');
            row.className = 'task-row';
            let rowHtml = `<div class="cell label-cell"><span>${t.name}</span><button class="delete-btn" onclick="deleteTask(${idx})">×</button></div>`;
            days.forEach(d => rowHtml += `<div class="cell ${holidays.includes(toISO(d)) ? 'holiday' : ''}" onclick="toggleHoliday('${toISO(d)}')"></div>`);
            row.innerHTML = rowHtml;
            row.appendChild(createBar(t));
            bodyTop.appendChild(row);

            getOccupiedDates(t).forEach(date => { dailyCount[date] = (dailyCount[date] || 0) + 1; });
        });

        Array.from(headerTop.children).forEach((cell, i) => {
            if (i === 0) return;
            const dateStr = toISO(days[i-1]);
            if (dailyCount[dateStr] > 2) {
                const alert = document.createElement('span');
                alert.className = 'overlap-alert';
                alert.title = "Overload! More than 2 tasks scheduled.";
                alert.innerText = '⚠️';
                cell.appendChild(alert);
            }
        });

        // SUMMARY GRID (Main Work & Overload)
        bodyBottom.innerHTML = '';
        const summaryRows = [[], []];
        const rowNames = ["MAIN WORK", "OVERLOAD"];
        
        tasks.sort((a,b) => fromISO(a.start) - fromISO(b.start)).forEach(t => {
            let placed = false;
            for(let i=0; i<2; i++) {
                if (!isOverlap(t, summaryRows[i])) {
                    summaryRows[i].push(t);
                    placed = true;
                    break;
                }
            }
        });

        summaryRows.forEach((rowTasks, idx) => {
            const row = document.createElement('div');
            row.className = 'task-row';
            let rowHtml = `<div class="cell label-cell">${rowNames[idx]}</div>`;
            days.forEach(d => rowHtml += `<div class="cell ${holidays.includes(toISO(d)) ? 'holiday' : ''}"></div>`);
            row.innerHTML = rowHtml;
            rowTasks.forEach(t => row.appendChild(createBar(t, false)));
            bodyBottom.appendChild(row);
        });
    }

    function getOccupiedDates(t) {
        let dates = []; let currentWork = 0; let tempDate = fromISO(t.start);
        while (holidays.includes(toISO(tempDate))) tempDate.setDate(tempDate.getDate() + 1);
        while (currentWork < t.dur) {
            const dStr = toISO(tempDate);
            if (!holidays.includes(dStr)) { dates.push(dStr); currentWork += 1; }
            tempDate.setDate(tempDate.getDate() + 1);
            if (tempDate > endRange) break;
        }
        return dates;
    }

    function isOverlap(task, existingTasks) {
        const newDates = getOccupiedDates(task);
        for (let t of existingTasks) {
            const existingDates = getOccupiedDates(t);
            if (newDates.some(d => existingDates.includes(d))) return true;
        }
        return false;
    }

    function createBar(t, draggable = true) {
        const group = document.createElement('div');
        group.className = 'task-group';
        group.style.setProperty('--task-color', t.color);
        
        let visualStart = fromISO(t.start);
        while (holidays.includes(toISO(visualStart))) visualStart.setDate(visualStart.getDate() + 1);
        let dayOffset = Math.round((visualStart - startRange) / (1000*60*60*24));
        group.style.left = `${labelW + (dayOffset * cellW)}px`;

        let currentWork = 0; let tempDate = new Date(visualStart);
        while (currentWork < t.dur) {
            const isH = holidays.includes(toISO(tempDate));
            const seg = document.createElement('div');
            let wFactor = (t.dur - currentWork < 1 && !isH) ? (t.dur - currentWork) : 1;
            
            if (isH) {
                seg.className = 'task-segment gap';
                seg.style.width = `${cellW}px`;
            } else {
                seg.className = 'task-segment';
                if (currentWork === 0) seg.classList.add('segment-start');
                if (currentWork + wFactor >= t.dur) {
                    seg.classList.add('segment-end');
                    seg.innerText = t.name;
                    seg.style.width = `${(wFactor * cellW) - 1}px`;
                } else {
                    seg.style.width = `${cellW}px`;
                }
                currentWork += 1;
            }
            group.appendChild(seg);
            tempDate.setDate(tempDate.getDate() + 1);
            if (tempDate > endRange) break;
        }

        if (draggable) {
            group.onmousedown = (e) => {
                let initialX = e.clientX;
                let originalStart = fromISO(t.start);
                document.onmousemove = (me) => {
                    let delta = Math.round((me.clientX - initialX) / cellW);
                    let newDate = new Date(originalStart);
                    newDate.setDate(newDate.getDate() + delta);
                    if (newDate >= startRange) { t.start = toISO(newDate); render(); }
                };
                document.onmouseup = () => { document.onmousemove = null; saveLocally(); };
            };
        }
        return group;
    }

    function toggleHoliday(dateStr) {
        const i = holidays.indexOf(dateStr);
        i > -1 ? holidays.splice(i, 1) : holidays.push(dateStr);
        saveLocally(); render();
    }

    function addTask() {
        const name = document.getElementById('name').value;
        const start = document.getElementById('date').value;
        const dur = parseFloat(document.getElementById('dur').value);
        if (name && start && !isNaN(dur)) {
            tasks.push({ name, start, dur, color: document.getElementById('color').value });
            saveLocally(); render();
        }
    }

    function deleteTask(idx) { tasks.splice(idx, 1); saveLocally(); render(); }
    loadData();
    render();
</script>
</body>
</html>
